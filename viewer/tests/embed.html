<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>FHLS embedding check</title>
<body style="margin:0;background:#141414;color:#ECE9E2"><div id="host" style="height:600px;width:800px"></div>
<script type="module">
import { createViewer } from '../index.js';
const viewer = createViewer(document.getElementById('host'), { presentation: false });
window.embeddedViewer = viewer; window.pickCount = 0;
viewer.onPick((lat,lon) => { window.pickCount++; window.lastPick={lat,lon}; viewer.flyTo(lat,lon); });
</script></body></html>
