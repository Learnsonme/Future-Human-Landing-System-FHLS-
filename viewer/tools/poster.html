<!doctype html><html lang="en"><meta charset="utf-8"><title>FHLS poster capture</title>
<!-- Dev tool: renders the landing (presentation) Moon so make-poster.mjs can save its first frame. -->
<style>html,body{margin:0;background:transparent}#host{width:640px;height:640px}
.fhls-viewer-status,.fhls-viewer-start,.fhls-viewer-poster{display:none!important}</style>
<div id="host"></div>
<script type="module">
import { createViewer } from '../index.js';
const viewer = createViewer(document.getElementById('host'));
window.posterViewer = viewer;
viewer.ready.then(() => { window.posterReady = true; });
</script></html>
